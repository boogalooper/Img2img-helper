name: Build release

run-name: Release ${{ inputs.version || 'version from JSX' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (leave empty to use VER from JSX)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"

          # If no version was entered, read VER from the JSX file.
          if [ -z "${VERSION}" ]; then
            VERSION=$(sed -n 's/.*VER[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "img2img helper.jsx" | head -n 1)
          fi

          # Accept both "0.14" and "v0.14".
          VERSION="${VERSION#v}"

          if [ -z "${VERSION}" ]; then
            echo "Could not determine version."
            exit 1
          fi

          if ! [[ "${VERSION}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid version: ${VERSION}"
            exit 1
          fi

          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "Version: ${VERSION}"
          echo "Tag: ${TAG}"

      - name: Prepare release package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_NAME="img2img-helper-${VERSION}"
          PACKAGE_DIR="dist/${PACKAGE_NAME}"

          mkdir -p "${PACKAGE_DIR}"

          cp "img2img helper.jsx" "${PACKAGE_DIR}/"
          cp "img2img-api.pyw" "${PACKAGE_DIR}/"
          cp "README.md" "${PACKAGE_DIR}/"

          cp -R "forge-schemas" "${PACKAGE_DIR}/"
          cp -R "advanced" "${PACKAGE_DIR}/"

          cd dist
          zip -r "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}"

      - name: Prepare release notes
        shell: bash
        run: |
          {
            echo "## История изменений"
            echo
            git log -1 --format=%B
          } > release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          ARCHIVE="dist/img2img-helper-${VERSION}.zip"

          gh release create "${TAG}" \
            "${ARCHIVE}" \
            --target "${GITHUB_SHA}" \
            --title "img2img helper ${VERSION}" \
            --notes-file release-notes.md \
            --latest