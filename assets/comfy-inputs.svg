<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="464" viewBox="0 0 1100 464" role="img" aria-labelledby="title desc"><title id="title">Что передаётся в LoadImage</title><desc id="desc">Назначьте роль каждому входу в настройках workflow: кнопка ⚙ рядом со списком.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7a8ca1"/></marker></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1100" height="464" rx="20" fill="#f3f6fb"/><text x="32" y="43" font-size="27" fill="#243447" font-weight="700">Что передаётся в LoadImage</text><text x="32" y="75" font-size="17" fill="#526478" font-weight="400">Назначьте роль каждому входу в настройках workflow: кнопка ⚙ рядом со списком.</text><rect x="32" y="108" width="502" height="152" rx="14" fill="#ffffff" stroke="#dbe3ed" stroke-width="2"/><circle cx="64" cy="139" r="14" fill="#235fe5"/><text x="59" y="145" font-size="16" fill="white" font-weight="700">1</text><text x="90" y="146" font-size="22" fill="#243447" font-weight="700">Изображение Photoshop</text><rect x="52" y="169" width="86" height="67" rx="14" fill="#eaf0ff" stroke="#c5d4fa" stroke-width="2"/><text x="63" y="211" font-size="21" fill="#235fe5" font-weight="700">PS</text><text x="156" y="196" font-size="18" fill="#526478" font-weight="400">Текущее выделение</text><text x="156" y="224" font-size="18" fill="#526478" font-weight="400">из открытого документа.</text><rect x="566" y="108" width="502" height="152" rx="14" fill="#ffffff" stroke="#dbe3ed" stroke-width="2"/><circle cx="598" cy="139" r="14" fill="#235fe5"/><text x="593" y="145" font-size="16" fill="white" font-weight="700">2</text><text x="624" y="146" font-size="22" fill="#243447" font-weight="700">Референс</text><rect x="586" y="169" width="86" height="67" rx="14" fill="#eaf0ff" stroke="#c5d4fa" stroke-width="2"/><text x="597" y="211" font-size="21" fill="#235fe5" font-weight="700">REF</text><text x="690" y="196" font-size="18" fill="#526478" font-weight="400">Файл, выбранный</text><text x="690" y="224" font-size="18" fill="#526478" font-weight="400">в интерфейсе скрипта.</text><rect x="32" y="286" width="502" height="152" rx="14" fill="#ffffff" stroke="#dbe3ed" stroke-width="2"/><circle cx="64" cy="317" r="14" fill="#235fe5"/><text x="59" y="323" font-size="16" fill="white" font-weight="700">3</text><text x="90" y="324" font-size="22" fill="#243447" font-weight="700">Файл из workflow</text><rect x="52" y="347" width="86" height="67" rx="14" fill="#eaf0ff" stroke="#c5d4fa" stroke-width="2"/><text x="63" y="389" font-size="21" fill="#235fe5" font-weight="700">JSON</text><text x="156" y="374" font-size="18" fill="#526478" font-weight="400">Файл, сохранённый</text><text x="156" y="402" font-size="18" fill="#526478" font-weight="400">в ноде API-workflow.</text><rect x="566" y="286" width="502" height="152" rx="14" fill="#ffffff" stroke="#dbe3ed" stroke-width="2"/><circle cx="598" cy="317" r="14" fill="#235fe5"/><text x="593" y="323" font-size="16" fill="white" font-weight="700">4</text><text x="624" y="324" font-size="22" fill="#243447" font-weight="700">Пустое изображение</text><rect x="586" y="347" width="86" height="67" rx="14" fill="#eaf0ff" stroke="#c5d4fa" stroke-width="2"/><text x="597" y="389" font-size="21" fill="#235fe5" font-weight="700">—</text><text x="690" y="374" font-size="18" fill="#526478" font-weight="400">Нейтральное изображение</text><text x="690" y="402" font-size="18" fill="#526478" font-weight="400">подходящего размера.</text></g></svg>