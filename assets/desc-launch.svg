<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="504" viewBox="0 0 1100 504" role="img" aria-labelledby="title desc"><title id="title">Повторная обработка из DESC</title><desc id="desc">Файл хранит снимок параметров; модели, workflow и референсы нужны отдельно.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7a8ca1"/></marker></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1100" height="504" rx="20" fill="#f3f6fb"/><text x="32" y="43" font-size="27" fill="#243447" font-weight="700">Повторная обработка из DESC</text><text x="32" y="75" font-size="17" fill="#526478" font-weight="400">Файл хранит снимок параметров; модели, workflow и референсы нужны отдельно.</text><rect x="32" y="108" width="490" height="129" rx="14" fill="#ffffff" stroke="#dbe3ed" stroke-width="2"/><circle cx="64" cy="137" r="14" fill="#235fe5"/><text x="59" y="143" font-size="16" fill="white" font-weight="700">1</text><text x="90" y="144" font-size="22" fill="#243447" font-weight="700">Сохраните параметры</text><text x="52" y="183" font-size="18" fill="#526478" font-weight="400">Shift + Generate → выберите имя .desc</text><text x="52" y="211" font-size="18" fill="#526478" font-weight="400">Генерация при экспорте не запускается.</text><rect x="578" y="108" width="490" height="129" rx="14" fill="#ffffff" stroke="#dbe3ed" stroke-width="2"/><circle cx="610" cy="137" r="14" fill="#235fe5"/><text x="605" y="143" font-size="16" fill="white" font-weight="700">2</text><text x="636" y="144" font-size="22" fill="#243447" font-weight="700">Передайте путь к файлу</text><text x="598" y="183" font-size="18" fill="#526478" font-weight="400">Путь к .desc — аргумент запуска JSX.</text><text x="598" y="211" font-size="18" fill="#526478" font-weight="400">Главное окно настроек не открывается.</text><path d="M530 173 L569 173" stroke="#7a8ca1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M823 245 L823 274" stroke="#7a8ca1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M823 274 L298 274" stroke="#7a8ca1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M298 274 L298 303" stroke="#7a8ca1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M823 274 L823 303" stroke="#7a8ca1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="32" y="310" width="490" height="127" rx="14" fill="#e6f5ef" stroke="#b3dccb" stroke-width="2"/><text x="52" y="346" font-size="23" fill="#187458" font-weight="700">Успешно</text><text x="52" y="383" font-size="18" fill="#526478" font-weight="400">Результат на новом слое.</text><text x="52" y="411" font-size="18" fill="#526478" font-weight="400">Параметры берутся из снимка DESC.</text><rect x="578" y="310" width="490" height="127" rx="14" fill="#fff0f2" stroke="#eac3cb" stroke-width="2"/><text x="598" y="346" font-size="23" fill="#ad3652" font-weight="700">Ошибка</text><text x="598" y="383" font-size="18" fill="#526478" font-weight="400">Окно с описанием причины.</text><text x="598" y="411" font-size="18" fill="#526478" font-weight="400">Исключение передаётся запускателю.</text><text x="32" y="478" font-size="18" fill="#243447" font-weight="400">Esc отменяет операцию без сообщения об ошибке.</text></g></svg>