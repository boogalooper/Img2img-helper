<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc"><title id="title">От выделения до нового слоя</title><desc id="desc">Область проходит через выбранный бэкенд и возвращается в документ.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7a8ca1"/></marker></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1100" height="390" rx="20" fill="#f3f6fb"/><text x="32" y="43" font-size="27" fill="#243447" font-weight="700">От выделения до нового слоя</text><text x="32" y="75" font-size="17" fill="#526478" font-weight="400">Область проходит через выбранный бэкенд и возвращается в документ.</text><rect x="32" y="104" width="304" height="260" rx="14" fill="#ffffff" stroke="#dbe3ed" stroke-width="2"/><circle cx="64" cy="134" r="14" fill="#235fe5"/><text x="59" y="140" font-size="16" fill="white" font-weight="700">1</text><text x="90" y="141" font-size="22" fill="#243447" font-weight="700">Photoshop</text><rect x="398" y="104" width="304" height="260" rx="14" fill="#ffffff" stroke="#dbe3ed" stroke-width="2"/><circle cx="430" cy="134" r="14" fill="#235fe5"/><text x="425" y="140" font-size="16" fill="white" font-weight="700">2</text><text x="456" y="141" font-size="22" fill="#243447" font-weight="700">Генерация</text><rect x="764" y="104" width="304" height="260" rx="14" fill="#ffffff" stroke="#dbe3ed" stroke-width="2"/><circle cx="796" cy="134" r="14" fill="#235fe5"/><text x="791" y="140" font-size="16" fill="white" font-weight="700">3</text><text x="822" y="141" font-size="22" fill="#243447" font-weight="700">Результат</text><rect x="53" y="163" width="262" height="120" rx="14" fill="#e9eff8" stroke="#dbe3ed" stroke-width="2"/><path d="M65 270 L135 197 L182 247 L228 207 L304 271" fill="#b9cbe3"/><rect x="118" y="178" width="120" height="90" rx="14" fill="none" stroke="#235fe5" stroke-width="2" stroke-dasharray="6 5"/><text x="52" y="315" font-size="18" fill="#526478" font-weight="400">Выделите область</text><text x="52" y="343" font-size="18" fill="#526478" font-weight="400">в RGB-документе</text><rect x="419" y="168" width="262" height="46" rx="14" fill="#eaf0ff" stroke="#c5d4fa" stroke-width="2"/><text x="439" y="198" font-size="20" fill="#235fe5" font-weight="700">ComfyUI / Forge Neo</text><text x="419" y="247" font-size="18" fill="#526478" font-weight="400">Workflow или пресет</text><text x="419" y="275" font-size="18" fill="#526478" font-weight="400">Prompt и параметры</text><text x="419" y="303" font-size="18" fill="#526478" font-weight="400">Нажмите Generate</text><rect x="785" y="168" width="262" height="46" rx="14" fill="#e6f5ef" stroke="#b3dccb" stroke-width="2"/><text x="800" y="198" font-size="21" fill="#187458" font-weight="700">generated image</text><rect x="785" y="228" width="62" height="62" rx="14" fill="#243447" stroke="#dbe3ed" stroke-width="2"/><rect x="799" y="240" width="33" height="37" rx="14" fill="#fff" stroke="#fff" stroke-width="2"/><text x="861" y="247" font-size="17" fill="#526478" font-weight="400">Маска исходного</text><text x="861" y="275" font-size="17" fill="#526478" font-weight="400">выделения</text><text x="785" y="333" font-size="18" fill="#243447" font-weight="400">Отдельный слой</text><path d="M344 230 L389 230" stroke="#7a8ca1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M710 230 L755 230" stroke="#7a8ca1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/></g></svg>