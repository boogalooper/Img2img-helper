<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="452" viewBox="0 0 1100 452" role="img" aria-labelledby="title desc"><title id="title">Inpainting: две разные области</title><desc id="desc">Условная схема: розовая область — маска изменения; синий контур — отправляемый фрагмент.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7a8ca1"/></marker></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1100" height="452" rx="20" fill="#f3f6fb"/><text x="32" y="43" font-size="27" fill="#243447" font-weight="700">Inpainting: две разные области</text><text x="32" y="75" font-size="17" fill="#526478" font-weight="400">Условная схема: розовая область — маска изменения; синий контур — отправляемый фрагмент.</text><rect x="32" y="107" width="568" height="322" rx="14" fill="#ffffff" stroke="#dbe3ed" stroke-width="2"/><text x="52" y="139" font-size="19" fill="#243447" font-weight="700">Документ Photoshop</text><rect x="52" y="158" width="528" height="246" rx="14" fill="#e9eff8" stroke="#dbe3ed" stroke-width="2"/><path d="M65 394 L210 214 L300 328 L390 247 L565 394" fill="#b9cbe3"/><rect x="133" y="183" width="348" height="191" rx="14" fill="none" stroke="#235fe5" stroke-width="2" stroke-dasharray="8 5"/><path d="M244 254 C232 215 300 212 323 236 C348 252 345 281 321 303 C295 331 231 302 244 254Z" fill="#e76078" fill-opacity="0.8" stroke="#c5405b" stroke-width="2"/><circle cx="651" cy="133" r="14" fill="#235fe5"/><text x="646" y="139" font-size="16" fill="white" font-weight="700">1</text><text x="677" y="140" font-size="22" fill="#243447" font-weight="700">Quick Mask</text><text x="637" y="181" font-size="18" fill="#526478" font-weight="400">Обозначьте область,</text><text x="637" y="209" font-size="18" fill="#526478" font-weight="400">которую нужно изменить.</text><text x="637" y="237" font-size="18" fill="#526478" font-weight="400">Затем оставайтесь</text><text x="637" y="265" font-size="18" fill="#526478" font-weight="400">в режиме Quick Mask.</text><circle cx="651" cy="295" r="14" fill="#235fe5"/><text x="646" y="301" font-size="16" fill="white" font-weight="700">2</text><text x="677" y="302" font-size="22" fill="#243447" font-weight="700">Внешнее выделение</text><text x="637" y="343" font-size="18" fill="#526478" font-weight="400">Задайте границы фрагмента,</text><text x="637" y="371" font-size="18" fill="#526478" font-weight="400">отправляемого на обработку.</text><text x="637" y="399" font-size="18" fill="#526478" font-weight="400">В workflow маска должна</text><text x="637" y="427" font-size="18" fill="#526478" font-weight="400">иметь статус «используется».</text></g></svg>